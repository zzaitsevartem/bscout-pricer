[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bscout-backend"
version = "0.1.0"
description = "BScout API — search and compare prices for electronics parts"
requires-python = ">=3.11,<3.12"
authors = [{ name = "BScout Team" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
# Консервативный набор для авто-fix через PostToolUse-хук:
# E/W (pycodestyle), F (pyflakes), I (isort). Расширяйте при необходимости.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# __init__.py содержат намеренные ре-экспорты (напр. <name>_router) — не считать их unused,
# иначе авто-fix хука их удалит и сломает импорты в main.py.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
